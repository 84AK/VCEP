<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다정한 마음 배달부 - VCEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wood: #5d4037;
            --paper: #fdfbf7;
            --accent: #d4a373;
            --success: #2ecc71;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Nanum Myeongjo', serif; overflow: hidden;
            background: #222;
        }

        /* Background */
        .post-office-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('assets/post_office_bg.png') no-repeat center center;
            background-size: cover; z-index: 1; filter: brightness(0.9);
            transition: 1s ease;
        }
        .post-office-bg.happy { filter: brightness(1.1) saturate(1.2); }

        /* Main UI */
        .overlay {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.1);
        }

        header {
            width: 100%; padding: 50px 30px; text-align: center; color: white;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }
        header h1 { 
            font-family: 'Gaegu'; font-size: 3.8rem; margin: 0; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            letter-spacing: 5px;
        }
        header p { 
            font-size: 1.2rem; opacity: 0.9; letter-spacing: 3px; 
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Game Board */
        .game-board {
            flex: 1; width: 100%; max-width: 600px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative;
        }

        /* Letter Box */
        .mailbox {
            width: 200px; cursor: pointer; transition: 0.3s;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            animation: bounce 2s infinite ease-in-out;
        }
        .mailbox:hover { transform: scale(1.1) rotate(-5deg); }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Letter Content Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 100; display: none; align-items: center; justify-content: center;
        }
        .letter-paper {
            width: 90%; max-width: 450px; background: var(--paper);
            padding: 50px 40px; border-radius: 5px; position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.9); opacity: 0; transition: 0.5s;
            border-left: 30px solid #f3e5ab;
        }
        .modal.open { display: flex; }
        .modal.open .letter-paper { transform: scale(1); opacity: 1; }

        .letter-text {
            font-size: 1.2rem; line-height: 1.8; color: #333;
            margin-bottom: 40px; word-break: keep-all; font-weight: 400;
        }

        /* Choices */
        .choice-list { display: flex; flex-direction: column; gap: 15px; }
        .choice-btn {
            background: white; border: 1px solid #ddd; padding: 15px 20px;
            border-radius: 15px; cursor: pointer; text-align: left;
            font-size: 1rem; transition: 0.3s; font-family: inherit;
            color: #444; line-height: 1.4;
        }
        .choice-btn:hover { background: #fdf5e6; border-color: var(--accent); transform: translateX(10px); }

        /* Stamp Effect */
        .stamp {
            position: absolute; top: 20px; right: 20px; width: 80px; height: 80px;
            border: 4px solid var(--success); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--success); font-weight: 900; font-family: 'Gaegu';
            font-size: 1.5rem; transform: rotate(-20deg) scale(2); opacity: 0;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .stamp.applied { opacity: 1; transform: rotate(-20deg) scale(1); }

        /* Happiness Gauge */
        .gauge-container {
            position: fixed; bottom: 40px; width: 80%; max-width: 400px;
            height: 12px; background: rgba(255,255,255,0.2);
            border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3);
        }
        .gauge-fill {
            width: 0%; height: 100%; background: linear-gradient(90deg, #ff9a9e, #fad0c4);
            transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(255, 154, 158, 0.5);
        }

        /* Success Modal Styles */
        .success-content {
            background: white; padding: 40px; border-radius: 20px;
            text-align: center; max-width: 500px; width: 90%;
            box-shadow: 0 30px 100px rgba(0,0,0,0.5);
            animation: successAppear 1s ease-out;
        }
        .success-content img { width: 100%; border-radius: 15px; margin-bottom: 25px; }
        @keyframes successAppear {
            from { transform: scale(0.5) translateY(100px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        #hint { position: fixed; bottom: 80px; color: white; opacity: 0.7; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="post-office-bg" id="bg"></div>
    
    <div class="overlay">
        <header>
            <h1>마음 우체국</h1>
            <p>다정한 마음을 배달합니다</p>
        </header>

        <div class="game-board">
            <div class="mailbox" id="mailbox" onclick="openLetter()">
                <div style="font-size: 8rem; text-align: center;">📮</div>
            </div>
        </div>

        <div id="hint">우체통을 눌러 새로운 고민 편지를 확인하세요</div>

        <div class="gauge-container">
            <div class="gauge-fill" id="gauge"></div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="success-content">
            <img src="assets/delivery_success.png" alt="최고의 우체부">
            <h2 style="font-family: 'Gaegu'; font-size: 2.5rem; color: var(--wood);">최고의 마음 배달부!</h2>
            <p style="font-size: 1.1rem; line-height: 1.6; color: #666; word-break: keep-all;">
                모든 편지에 따뜻한 마음을 담아 배달해 주셨군요.<br>
                당신의 다정한 공감 덕분에 마을 친구들이<br>
                오늘 하루를 아주 행복하게 보낼 수 있게 되었어요.
            </p>
            <button class="btn-next" style="background:var(--success); width: 100%;" onclick="location.reload()">새로운 마을로 떠나기</button>
        </div>
    </div>

    <!-- Letter Modal -->
    <div class="modal" id="modal">
        <div class="letter-paper">
            <div class="stamp" id="stamp">참 잘했어요</div>
            <div class="letter-text" id="letterBody"></div>
            <div class="choice-list" id="choices"></div>
            <button id="closeBtn" style="display:none; margin-top:30px; width:100%; padding:15px; border-radius:15px; border:none; background:var(--wood); color:white; cursor:pointer;" onclick="closeModal()">다음 편지 기다리기</button>
        </div>
    </div>

    <script>
        const letters = [
            {
                text: "안녕하세요... 저는 요즘 너무 우울해요. 기말고사 준비를 정말 열심히 했는데, 점수가 생각보다 너무 안 나왔거든요. 부모님께는 죄송하고 저 자신이 너무 한심해 보여요.",
                choices: [
                    { text: "“그럴 수도 있지, 다음 시험엔 더 열심히 하면 되잖아!”", score: 1 },
                    { text: "“네가 공부 방법이 좀 잘못된 건 아닐까? 학원을 바꿔봐.”", score: 0 },
                    { text: "“정말 속상하겠구나. 네가 밤새워 공부한 거 내가 다 아는데... 너 자신을 너무 탓하지 않았으면 좋겠어.”", score: 2 }
                ],
                feedback: "정말 훌륭한 공감이에요! 결과보다 과정을 먼저 인정해주면 상대방은 큰 위로를 받아요."
            },
            {
                text: "가장 친한 친구랑 사소한 일로 다퉜어요. 먼저 사과하고 싶은데 자존심도 상하고, 혹시 친구가 안 받아주면 어떡하죠? 하루 종일 가슴이 답답해요.",
                choices: [
                    { text: "“네가 먼저 미안하다고 해. 친구 사이인데 자존심이 뭐가 중요해.”", score: 1 },
                    { text: "“불안하고 걱정되는구나. 친구를 잃고 싶지 않은 네 마음이 느껴져. 사과할 용기를 내는 건 정말 멋진 일이야.”", score: 2 },
                    { text: "“다른 친구 사귀면 되지 뭘 그렇게 고민해? 잊어버려.”", score: 0 }
                ],
                feedback: "상대방의 '불안함'을 먼저 읽어주셨군요! 감정을 알아주는 것만으로도 답답함이 줄어든답니다."
            },
            {
                text: "요즘 제가 뭘 좋아하는지 모르겠어요. 친구들은 다 꿈이 있는데 저만 제자리인 것 같아 불안해요. 제가 잘하는 게 하나도 없는 것 같아요.",
                choices: [
                    { text: "“너만 그런 거 아니야. 다들 그렇게 살아. 너무 예민하게 굴지 마.”", score: 0 },
                    { text: "“좋아하는 걸 찾아보려고 노력은 해봤니? 일단 뭐라도 시작해봐.”", score: 1 },
                    { text: "“남들과 비교하면 마음이 조급해질 수 있지. 하지만 너만의 속도가 있는 거야. 아무것도 안 해도 너는 충분히 소중해.”", score: 2 }
                ],
                feedback: "존재 자체를 긍정해주는 답변이네요! 상대방의 조급함을 따뜻하게 안아주었습니다."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let happiness = 0;
        let audioCtx;

        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        function openLetter() {
            initAudio();
            const modal = document.getElementById('modal');
            const body = document.getElementById('letterBody');
            const choiceBox = document.getElementById('choices');
            const stamp = document.getElementById('stamp');
            const closeBtn = document.getElementById('closeBtn');

            const letter = letters[currentIdx % letters.length];
            body.innerText = letter.text;
            choiceBox.innerHTML = '';
            stamp.classList.remove('applied');
            closeBtn.style.display = 'none';

            letter.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = c.text;
                btn.onclick = () => selectChoice(c.score, letter.feedback);
                choiceBox.appendChild(btn);
            });

            modal.classList.add('open');
            playPaperSound();
        }

        function selectChoice(s, feedback) {
            const stamp = document.getElementById('stamp');
            const body = document.getElementById('letterBody');
            const choiceBox = document.getElementById('choices');
            const closeBtn = document.getElementById('closeBtn');
            const bg = document.getElementById('bg');

            if(s === 2) {
                stamp.innerText = "참 따뜻해요";
                stamp.style.color = "var(--success)";
                stamp.style.borderColor = "var(--success)";
                happiness += 34;
                bg.classList.add('happy');
            } else if(s === 1) {
                stamp.innerText = "조금 더 깊이";
                stamp.style.color = "var(--accent)";
                stamp.style.borderColor = "var(--accent)";
                happiness += 10;
            } else {
                stamp.innerText = "서운할지도..";
                stamp.style.color = "#e74c3c";
                stamp.style.borderColor = "#e74c3c";
            }

            stamp.classList.add('applied');
            body.innerHTML = `<strong>[우체부의 한 마디]</strong><br>${feedback}`;
            choiceBox.innerHTML = '';
            closeBtn.style.display = 'block';
            
            updateGauge();
            playStampSound();
        }

        function updateGauge() {
            if(happiness > 100) happiness = 100;
            document.getElementById('gauge').style.width = happiness + '%';
            
            if(happiness >= 100) {
                setTimeout(showSuccess, 1500);
            }
        }

        function showSuccess() {
            document.getElementById('successModal').classList.add('open');
            playSuccessSound();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            document.getElementById('bg').classList.remove('happy');
            currentIdx++;
        }

        // --- Sounds ---
        function playPaperSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'brown';
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playStampSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + i * 0.15);
                gain.gain.setValueAtTime(0.05, now + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.6);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.6);
            });
        }
    </script>
</body>
</html>
