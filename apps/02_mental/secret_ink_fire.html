<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 잉크와 불꽃: 사운드 리추얼 - VCEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1412;
            --paper: #f4e9d8;
            --gold: #ffcc00;
            --fire: #ff4500;
        }

        body {
            background: var(--bg);
            color: #d4a373;
            margin: 0;
            overflow: hidden;
            font-family: 'Nanum Myeongjo', serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .table {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1412;
            background-image: url("https://www.transparenttextures.com/patterns/dark-wood.png");
            background-size: 400px;
            z-index: 1;
        }

        .ambient-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,0.8) 100%);
            z-index: 2; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10; width: 100%; max-width: 500px;
            height: 100%; display: flex; flex-direction: column;
            padding: 10px 20px; box-sizing: border-box; align-items: center;
        }

        header h1 {
            font-family: 'Outfit'; font-size: 0.7rem; letter-spacing: 5px;
            opacity: 0.3; margin: 15px 0; color: #fff; text-transform: uppercase;
        }

        .jar-section {
            width: 100%; display: flex; justify-content: flex-end; padding-right: 30px; margin-bottom: 50px;
        }
        .jar-wrap { position: relative; width: 55px; height: 85px; }
        .jar-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(255,215,0,0.2)); }
        .jar-label { 
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            font-size: 0.65rem; color: #faedcd; opacity: 0.7; white-space: nowrap; letter-spacing: 2px;
            font-family: 'Outfit';
        }
        #jarLights { position: absolute; top: 25px; left: 10px; width: 35px; height: 45px; pointer-events: none; }

        .paper-container {
            position: relative; width: 92%; height: 350px;
            background: var(--paper); box-shadow: 0 40px 80px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,0.05);
            padding: 40px; box-sizing: border-box; border-radius: 2px;
            transform: rotate(-0.3deg);
        }

        #secretInput {
            width: 100%; height: 100%; background: transparent; border: none; outline: none;
            font-size: 1.2rem; line-height: 1.8; font-weight: 700;
            color: #3e2723; caret-color: #8b4513; z-index: 5; position: relative; resize: none;
            transition: color 1.2s;
        }

        #ashCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 200; pointer-events: none; }
        #burnCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 500; opacity: 0; pointer-events: none; }

        .sound-toggle {
            position: fixed; bottom: 20px; left: 20px; z-index: 1000;
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s;
        }
        .sound-toggle:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }
        .sound-toggle svg { width: 20px; height: 20px; fill: #faedcd; opacity: 0.7; }

        .match-box { position: absolute; bottom: 35px; display: flex; flex-direction: column; align-items: center; z-index: 300; }
        #match { width: 7px; height: 85px; background: #d4a373; border-radius: 0 0 5px 5px; position: relative; cursor: grab; }
        #matchHead { position: absolute; top: -11px; left: -2px; width: 11px; height: 17px; background: #6d0000; border-radius: 50%; }
        .flame {
            position: absolute; top: -45px; left: -14px; width: 34px; height: 55px;
            background: radial-gradient(circle at 50% 80%, #fff 0%, #ffdf00 30%, #ff4500 60%, transparent 100%);
            border-radius: 50% 50% 35% 35%; filter: blur(1px); animation: flicker 0.1s infinite alternate;
            display: none; box-shadow: 0 0 30px rgba(255, 69, 0, 0.6);
        }
        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }
        .striker { width: 70px; height: 25px; background: #2b1b17; margin-top: 15px; border-radius: 5px; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1000; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(20px);
        }
        .message { padding: 40px; text-align: center; color: #fff; line-height: 2.2; font-size: 1.25rem; font-weight: 700; }

        .controls { position: absolute; bottom: 45px; display: none; gap: 20px; z-index: 400; }
        .btn {
            padding: 12px 35px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: #fff; font-family: inherit; font-weight: 800;
            cursor: pointer; transition: 0.3s;
        }
        .btn-burn:hover { background: #ff4500; transform: scale(1.1); box-shadow: 0 0 30px #ff4500; }
    </style>
</head>
<body>
    <div class="table"></div>
    <div class="ambient-glow"></div>
    <div id="flash"></div>
    <canvas id="ashCanvas"></canvas>

    <div class="sound-toggle" onclick="toggleMusic()" id="soundToggle" title="음악 켜기/끄기">
        <svg viewBox="0 0 24 24" id="soundIconOff" style="display:block;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM3 9v6h4l5 5V4L7 9H3z"/></svg>
        <svg viewBox="0 0 24 24" id="soundIconOn" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>

    <div class="container">
        <header><h1>Ritual of Cleansing</h1></header>

        <div class="jar-section">
            <div class="jar-wrap">
                <div class="jar-label">SOUL LIGHT</div>
                <svg class="jar-svg" viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M35 10H65V25H35V10Z" fill="#5D4037"/>
                    <path d="M30 25H70C70 25 85 35 85 60V120C85 140 75 145 50 145C25 145 15 140 15 120V60C15 35 30 25 30 25Z" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.3"/>
                    <path d="M20 60C20 60 40 50 50 50C60 50 80 60 80 60" stroke="white" stroke-opacity="0.1"/>
                </svg>
                <div id="jarLights"></div>
            </div>
        </div>

        <div class="paper-container" id="paper">
            <textarea id="secretInput" placeholder="당신의 가장 깊은 고민을 이곳에 적으세요..."></textarea>
            <canvas id="burnCanvas"></canvas>
        </div>

        <div class="match-box" id="matchBox">
            <div id="match">
                <div id="matchHead"></div>
                <div class="flame" id="flame"></div>
            </div>
            <div class="striker" id="striker"></div>
        </div>

        <div class="controls" id="controls">
            <button class="btn btn-keep" onclick="action('keep')">간직하기</button>
            <button class="btn btn-burn" onclick="action('burn')">태워버리기</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="location.reload()">
        <div class="message" id="message"></div>
    </div>

    <script>
        (function() {
            const originalSetItem = localStorage.setItem;
            localStorage.setItem = function(key, value) {
                originalSetItem.apply(this, arguments);
                if(key.startsWith('vcep_')) {
                    try { window.parent.postMessage({ type: 'vcep_save', category: key.replace('vcep_', ''), data: JSON.parse(value) }, '*'); } catch(e) {}
                }
            };
        })();

        let audioCtx, bgmMasterGain;
        const input = document.getElementById('secretInput');
        const ashCanvas = document.getElementById('ashCanvas'), aCtx = ashCanvas.getContext('2d');
        const burnCanvas = document.getElementById('burnCanvas'), bCtx = burnCanvas.getContext('2d');
        const match = document.getElementById('match'), flame = document.getElementById('flame');
        
        let isLit = false, isDragging = false, isBurning = false, isPlaying = false;
        let particles = [], soulLights = parseInt(localStorage.getItem('vcep_soul_lights') || '0');

        function resize() {
            ashCanvas.width = window.innerWidth; ashCanvas.height = window.innerHeight;
            burnCanvas.width = document.getElementById('paper').offsetWidth;
            burnCanvas.height = document.getElementById('paper').offsetHeight;
            updateJar();
        }
        window.onresize = resize; resize();

        function toggleMusic() {
            if(!isPlaying) {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                
                if(!bgmMasterGain) {
                    bgmMasterGain = audioCtx.createGain();
                    bgmMasterGain.connect(audioCtx.destination);
                }
                
                isPlaying = true; // 상태를 먼저 활성화!
                startBGMSequencer(); // 그 다음 시퀀서 가동!
                
                bgmMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                bgmMasterGain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 2);
                
                document.getElementById('soundIconOff').style.display = 'none';
                document.getElementById('soundIconOn').style.display = 'block';
            } else {
                bgmMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                bgmMasterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
                isPlaying = false;
                document.getElementById('soundIconOff').style.display = 'block';
                document.getElementById('soundIconOn').style.display = 'none';
            }
        }

        window.addEventListener('click', () => { if(!isPlaying) toggleMusic(); }, { once: true });

        input.addEventListener('input', () => {
            input.style.color = '#3e2723';
            clearTimeout(window.t);
            window.t = setTimeout(() => { if(!input.matches(':focus')) input.style.color = 'transparent'; }, 2000);
        });

        match.addEventListener('mousedown', () => isDragging = true);
        match.addEventListener('touchstart', () => isDragging = true);
        window.addEventListener('mousemove', drag); window.addEventListener('touchmove', (e) => drag(e.touches[0]));

        function drag(e) {
            if (!isDragging || isBurning) return;
            const x = e.clientX - 4, y = e.clientY - 45;
            match.style.position = 'fixed'; match.style.left = x + 'px'; match.style.top = y + 'px';
            const s = document.getElementById('striker').getBoundingClientRect();
            if (!isLit && x > s.left && x < s.right && y > s.top - 20 && y < s.bottom) {
                isLit = true; flame.style.display = 'block';
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('matchBox').style.opacity = '0.2';
                if(navigator.vibrate) navigator.vibrate(50);
                playStrikeSound(); playFireSound();
            }
        }
        window.addEventListener('mouseup', () => isDragging = false);

        function action(type) {
            if (type === 'keep') { alert("안전하게 보관되었습니다."); location.reload(); }
            else { startRitual(); }
        }

        function startRitual() {
            isBurning = true; isLit = false; flame.style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('matchBox').style.display = 'none';
            input.style.display = 'none'; burnCanvas.style.display = 'block';
            
            if(bgmMasterGain) {
                bgmMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                bgmMasterGain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + 2);
            }

            let p = 0;
            function burn() {
                p += 2.5; bCtx.clearRect(0, 0, burnCanvas.width, burnCanvas.height);
                bCtx.save();
                bCtx.rect(0,0, burnCanvas.width, burnCanvas.height);
                bCtx.globalCompositeOperation = 'destination-out';
                bCtx.beginPath();
                for(let i=0; i<=burnCanvas.width; i+=10) {
                    const w = Math.sin(i*0.05 + p*0.1) * 20;
                    bCtx.lineTo(i, burnCanvas.height - p + w);
                }
                bCtx.lineTo(burnCanvas.width, 0); bCtx.lineTo(0,0); bCtx.fill();
                bCtx.restore();

                bCtx.strokeStyle = '#ff4500'; bCtx.lineWidth = 5; bCtx.shadowBlur = 20; bCtx.shadowColor = '#ffdf00';
                bCtx.beginPath();
                for(let i=0; i<=burnCanvas.width; i+=5) {
                    const w = Math.sin(i*0.05 + p*0.1) * 20;
                    const py = burnCanvas.height - p + w;
                    if(py < burnCanvas.height && py > -40) {
                        bCtx.lineTo(i, py);
                        if(Math.random() > 0.6) spawnParticle(i, py);
                    }
                }
                bCtx.stroke();
                if(p < burnCanvas.height + 150) requestAnimationFrame(burn);
                else transform();
            }
            burn();
        }

        function spawnParticle(x, y) {
            const r = document.getElementById('paper').getBoundingClientRect();
            particles.push({
                x: x + r.left, y: y + r.top, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 5 - 2,
                size: Math.random() * 6 + 2, life: 1, c: '#333', type: 'ash'
            });
        }

        function transform() {
            document.getElementById('flash').style.opacity = '1';
            playChimeSound();
            setTimeout(() => {
                document.getElementById('flash').style.opacity = '0';
                particles.forEach(p => { p.type = 'soul'; p.c = '#ffcc00'; p.vy = (Math.random() - 0.5) * 4; p.vx = (Math.random() - 0.5) * 4; });
                setTimeout(collect, 1500);
            }, 200);
        }

        function collect() {
            const jar = document.getElementById('jarLights').getBoundingClientRect();
            const tx = jar.left + jar.width/2, ty = jar.top + jar.height/2;
            particles.forEach(p => { p.type = 'collecting'; p.tx = tx; p.ty = ty; });
            setTimeout(() => {
                soulLights++; localStorage.setItem('vcep_soul_lights', soulLights);
                updateJar();
                document.getElementById('message').innerText = "태워진 고민은 이제 빛이 되어 당신을 지켜줄 거예요.";
                document.getElementById('overlay').style.display = 'flex';
                if(bgmMasterGain) {
                    bgmMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    bgmMasterGain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 2);
                }
            }, 2500);
        }

        function updateJar() {
            const jar = document.getElementById('jarLights'); jar.innerHTML = '';
            for(let i=0; i<Math.min(soulLights, 20); i++) {
                const b = document.createElement('div');
                b.style.cssText = `position:absolute; width:6px; height:6px; background:#ffcc00; border-radius:50%; filter:blur(1.5px);
                                   left:${Math.random()*80+10}%; bottom:${Math.random()*60+10}%; opacity:${Math.random()*0.8+0.2};
                                   animation: p 2s infinite alternate;`;
                jar.appendChild(b);
            }
        }

        function updateParticles() {
            aCtx.clearRect(0, 0, ashCanvas.width, ashCanvas.height);
            for(let i = particles.length-1; i>=0; i--) {
                const p = particles[i];
                if(p.type === 'collecting') { p.x += (p.tx - p.x) * 0.05; p.y += (p.ty - p.y) * 0.05; }
                else { p.x += p.vx; p.y += p.vy; if(p.type === 'ash') p.vy += 0.15; }
                p.life -= 0.005;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                aCtx.globalAlpha = p.life; aCtx.fillStyle = p.c;
                if(p.type !== 'ash') { aCtx.shadowBlur = 10; aCtx.shadowColor = '#ffcc00'; }
                aCtx.beginPath(); aCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); aCtx.fill();
                aCtx.shadowBlur = 0;
            }
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        // --- 사운드 엔진 ---
        function playStrikeSound() {
            if(!audioCtx) return;
            const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
            const d = b.getChannelData(0);
            for (let i = 0; i < b.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / 1000);
            const s = audioCtx.createBufferSource(); s.buffer = b;
            const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2000;
            const g = audioCtx.createGain(); g.gain.value = 0.1;
            s.connect(f); f.connect(g); g.connect(audioCtx.destination);
            s.start();
        }

        function playFireSound() {
            if(!audioCtx) return;
            const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 6, audioCtx.sampleRate);
            const d = b.getChannelData(0);
            for (let i = 0; i < b.length; i++) {
                let n = Math.random() * 2 - 1;
                if (Math.random() > 0.9995) n *= 10;
                d[i] = n;
            }
            const s = audioCtx.createBufferSource(); s.buffer = b;
            const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
            const g = audioCtx.createGain(); g.gain.value = 0.06;
            s.connect(f); f.connect(g); g.connect(audioCtx.destination);
            s.start();
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 6);
        }

        function playChimeSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        function startBGMSequencer() {
            if(!isPlaying) return;
            const notes = [
                { f: 329.63, t: 0 }, { f: 392.00, t: 0.5 }, { f: 440.00, t: 1.0 }, { f: 392.00, t: 1.5 },
                { f: 329.63, t: 2.0 }, { f: 293.66, t: 2.5 }, { f: 261.63, t: 3.0 }, { f: 293.66, t: 3.5 }
            ];
            let nextTime = audioCtx.currentTime + 0.1;
            function playStep() {
                if(!isPlaying) return;
                notes.forEach(note => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.f, nextTime + note.t);
                    filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, nextTime + note.t);
                    gain.gain.setValueAtTime(0, nextTime + note.t);
                    gain.gain.linearRampToValueAtTime(0.25, nextTime + note.t + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, nextTime + note.t + 0.8);
                    osc.connect(filter); filter.connect(gain); gain.connect(bgmMasterGain);
                    osc.start(nextTime + note.t); osc.stop(nextTime + note.t + 1);
                });
                nextTime += 4;
                setTimeout(playStep, 4000);
            }
            playStep();
        }
    </script>
    <style> @keyframes p { from { opacity: 0.3; } to { opacity: 1; } } </style>
</body>
</html>
