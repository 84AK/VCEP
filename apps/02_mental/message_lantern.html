<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억의 등불: 익명 속마음 - VCEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --night: #0a0e1a;
            --lake: #050810;
            --lantern: #ff9800;
            --glow: #ffcc00;
        }

        body {
            background: var(--night);
            color: #fff;
            margin: 0;
            overflow: hidden;
            font-family: 'Nanum Myeongjo', serif;
            height: 100vh;
        }

        /* Night Lake Background */
        .universe {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0a0e1a 0%, #1a2a4a 50%, #050810 100%);
            z-index: 1;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 50%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.3; z-index: 2;
        }

        canvas#lanternCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }

        /* UI Elements */
        .interface {
            position: relative; z-index: 100; width: 100%; height: 100%;
            display: flex; flex-direction: column; pointer-events: none;
            align-items: center; justify-content: center;
        }

        header { position: absolute; top: 30px; text-align: center; pointer-events: auto; }
        header h1 { font-family: 'Outfit'; font-size: 0.7rem; letter-spacing: 5px; opacity: 0.4; text-transform: uppercase; margin: 0; }
        header p { font-size: 1.1rem; color: #faedcd; margin: 10px 0; font-weight: 700; }

        /* Input Area */
        .input-card {
            width: 80%; max-width: 380px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 30px; text-align: center; pointer-events: auto;
            transition: 1s ease;
        }

        .input-card textarea {
            width: 100%; height: 150px; background: transparent; border: none;
            color: #faedcd; font-size: 1.1rem; line-height: 1.8; outline: none;
            resize: none; font-family: inherit; margin-bottom: 30px; text-align: center;
        }

        .btn-release {
            padding: 15px 40px; border-radius: 50px; background: var(--lantern); color: #fff;
            border: none; font-weight: 800; cursor: pointer; transition: 0.3s;
            font-family: 'Outfit'; letter-spacing: 2px;
        }
        .btn-release:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--lantern); }

        /* Lantern Message Viewer */
        .message-viewer {
            position: fixed; bottom: 120px; width: 100%; text-align: center;
            z-index: 200; pointer-events: none; display: none;
        }
        .message-bubble {
            display: inline-block; padding: 25px 45px; background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.4); border-radius: 50px;
            backdrop-filter: blur(15px); color: #faedcd; font-size: 1.1rem;
            animation: fadeInOut 5s forwards; box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
            max-width: 80%;
        }

        /* History Panel */
        .history-btn {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            background: rgba(255, 152, 0, 0.2); border: 1px solid rgba(255, 152, 0, 0.5);
            border-radius: 50%; color: #fff; cursor: pointer; z-index: 300;
            display: flex; justify-content: center; align-items: center; pointer-events: auto;
            transition: 0.3s;
        }
        .history-btn:hover { background: var(--lantern); transform: scale(1.1); }

        .history-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 26, 0.95); z-index: 1000; display: none;
            flex-direction: column; padding: 50px 20px; box-sizing: border-box;
            pointer-events: auto;
        }
        .history-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            margin-top: 30px; padding-bottom: 50px;
        }
        .history-item {
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px;
            border-left: 4px solid var(--lantern); line-height: 1.6; color: #faedcd;
        }
        .close-history {
            align-self: center; padding: 10px 30px; background: #333; color: #fff;
            border-radius: 50px; border: none; cursor: pointer; margin-top: 20px;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        #hint { position: fixed; bottom: 30px; width: 100%; text-align: center; opacity: 0.3; font-size: 0.7rem; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="universe"></div>
    <div class="stars"></div>
    <canvas id="lanternCanvas"></canvas>

    <div class="interface">
        <header>
            <h1>Memory Lantern</h1>
            <p>익명의 온기를 하늘로 띄웁니다</p>
        </header>

        <div class="input-card" id="inputCard">
            <textarea id="messageInput" placeholder="누구에게도 말하지 못한 진심이나&#10;따뜻한 응원의 한 줄을 적어보세요..."></textarea>
            <button class="btn-release" onclick="releaseLantern()">등불 띄우기</button>
        </div>

        <div id="hint">떠 있는 다른 등불을 터치하여 응원을 확인하세요</div>
        <div class="history-btn" onclick="toggleHistory()" title="응원 모아보기">📜</div>
    </div>

    <div class="message-viewer" id="messageViewer">
        <div class="message-bubble" id="bubbleText"></div>
    </div>

    <div class="history-panel" id="historyPanel">
        <h2 style="text-align: center; color: var(--lantern);">하늘로 띄운 마음들</h2>
        <div class="history-list" id="historyList"></div>
        <button class="close-history" onclick="toggleHistory()">돌아가기</button>
    </div>

    <script>
        const canvas = document.getElementById('lanternCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let lanterns = [];
        let audioCtx;

        // Simulated Global Pool
        const globalMessages = [
            "당신은 충분히 잘하고 있어요. 오늘 하루도 고생 많았어요.",
            "누군가 당신을 위해 기도하고 있다는 걸 잊지 마세요.",
            "잠시 쉬어가도 괜찮아요. 별들도 낮에는 쉬니까요.",
            "가장 어두운 밤이 지나야 가장 밝은 아침이 옵니다.",
            "당신의 미소가 누군가에겐 큰 힘이 됩니다.",
            "포기하지 마세요. 당신의 계절은 곧 올 거예요."
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.onresize = resize; resize();

        class Lantern {
            constructor(x, y, text, isUser = false) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.isUser = isUser;
                this.size = isUser ? 40 : 15 + Math.random() * 20;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = -0.5 - Math.random() * 0.5;
                this.flicker = Math.random() * Math.PI * 2;
                this.glow = 10 + Math.random() * 10;
                this.isClicked = false;
                this.clickAnim = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.flicker += 0.1;
                this.vx += Math.sin(this.flicker * 0.5) * 0.02;
                
                if (this.isClicked) {
                    this.clickAnim += (1 - this.clickAnim) * 0.1;
                    if (this.clickAnim > 0.99) this.isClicked = false;
                } else {
                    this.clickAnim *= 0.9;
                }

                if (this.y < -100) {
                    this.y = height + 100;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                const s = Math.sin(this.flicker) * 3;
                const clickScale = 1 + this.clickAnim * 0.5;
                
                ctx.save();
                ctx.shadowBlur = (this.glow + s) * (1 + this.clickAnim * 2);
                ctx.shadowColor = `rgba(255, 152, 0, ${0.8 + this.clickAnim * 0.2})`;
                
                // Draw Lantern Shape
                ctx.fillStyle = `rgba(255, 152, 0, ${0.9 + this.clickAnim * 0.1})`;
                ctx.beginPath();
                ctx.moveTo(this.x - (this.size/2) * clickScale, this.y + (this.size/2) * clickScale);
                ctx.lineTo(this.x + (this.size/2) * clickScale, this.y + (this.size/2) * clickScale);
                ctx.lineTo(this.x + (this.size/2 * 0.8) * clickScale, this.y - (this.size/2) * clickScale);
                ctx.lineTo(this.x - (this.size/2 * 0.8) * clickScale, this.y - (this.size/2) * clickScale);
                ctx.closePath();
                ctx.fill();

                // Inner Glow
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = 0.5 + Math.sin(this.flicker) * 0.2 + this.clickAnim * 0.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y + (this.size/4) * clickScale, (this.size/4) * clickScale, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Initialize Background Lanterns
        for(let i=0; i<30; i++) {
            const msg = globalMessages[i%globalMessages.length];
            lanterns.push(new Lantern(Math.random()*width, Math.random()*height, msg));
            addHistoryItem(msg);
        }

        function releaseLantern() {
            const input = document.getElementById('messageInput');
            if(!input.value) return;

            const textValue = input.value;
            const newLantern = new Lantern(width/2, height*0.7, textValue, true);
            lanterns.push(newLantern);
            addHistoryItem(textValue);

            // --- 데이터 저장 연동 ---
            let localData = JSON.parse(localStorage.getItem('vcep_message_lantern')) || [];
            const newRecord = { text: textValue, timestamp: new Date().toISOString() };
            localData.push(newRecord);
            localStorage.setItem('vcep_message_lantern', JSON.stringify(localData));
            // ---------------------

            const card = document.getElementById('inputCard');
            card.style.opacity = '0';
            card.style.transform = 'translateY(-50px) scale(0.9)';
            setTimeout(() => card.style.display = 'none', 1000);

            input.value = '';
            playReleaseSound();
            newLantern.vy = -1.5;
        }

        function addHistoryItem(text) {
            const list = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerText = text;
            list.prepend(item);
        }

        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
            initAudio();
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            let clicked = false;
            lanterns.forEach(l => {
                const dist = Math.sqrt((l.x-mx)**2 + (l.y-my)**2);
                if(dist < l.size * 3) { // Extended hitbox
                    l.isClicked = true;
                    l.clickAnim = 0.1;
                    showText(l.text);
                    playSparkleSound();
                    clicked = true;
                }
            });
            if(!clicked) initAudio();
        });

        function showText(msg) {
            const viewer = document.getElementById('messageViewer');
            const bubble = document.getElementById('bubbleText');
            bubble.innerText = msg;
            viewer.style.display = 'block';
            setTimeout(() => viewer.style.display = 'none', 5000);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Lake Reflection Gradient
            const grad = ctx.createLinearGradient(0, height*0.7, 0, height);
            grad.addColorStop(0, 'rgba(5, 8, 16, 0)');
            grad.addColorStop(1, 'rgba(5, 8, 16, 0.8)');
            
            lanterns.forEach(l => {
                l.update();
                l.draw();
                // Reflection
                ctx.save();
                ctx.globalAlpha = 0.2;
                ctx.translate(0, height*1.5);
                ctx.scale(1, -0.5);
                l.draw();
                ctx.restore();
            });

            ctx.fillStyle = grad;
            ctx.fillRect(0, height*0.7, width, height*0.3);

            requestAnimationFrame(animate);
        }
        animate();

        // --- Sound Engine ---
        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        function playReleaseSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        function playSparkleSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200 + Math.random()*400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    </script>
</body>
</html>
