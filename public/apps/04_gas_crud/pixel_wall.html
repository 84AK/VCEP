<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Master Pro | VCEP GAS CRUD</title>
    <!-- Tailwind is kept as an optional utility, but we will not rely on it for anything critical -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- Definitive Design System (Native CSS) --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #818CF8;
            --accent-hover: #4F46E5;
            --bg-deep: #020617;
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1E293B, #0F172A, #020617);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* Layout */
        /* Standard Nav Styles */
        nav {
            background: white;
            border-bottom: 1px solid #E0E0E0;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 0.8rem; }
        .sheet-title { font-weight: 700; font-size: 1.1rem; color: #3C4043; font-family: sans-serif; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { text-decoration: none; color: #5F6368; font-weight: 500; font-size: 0.9rem; transition: 0.2s; font-family: sans-serif; }
        .nav-link:hover { color: #0F9D58; }
        .nav-link.active { color: #0F9D58; font-weight: 700; }
        .nav-btn { background: #0F9D58; color: white; padding: 0.6rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.85rem; transition: 0.2s; font-family: sans-serif; }
        .nav-btn:hover { background: #0B8043; }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2rem;
        }

        .sidebar { grid-column: span 12; display: flex; flex-direction: column; gap: 1.5rem; }
        .main-content { grid-column: span 12; }

        @media (min-width: 1024px) {
            .sidebar { grid-column: span 4; }
            .main-content { grid-column: span 8; }
        }

        /* Components */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 2rem;
            box-shadow: var(--card-shadow);
        }

        .section-title {
            font-size: 0.95rem; font-weight: 700; margin-bottom: 1.25rem;
            display: flex; align-items: center; gap: 0.75rem; color: var(--accent-primary);
        }

        .input-dark {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #818CF8; padding: 0.9rem 1.25rem; border-radius: 14px; outline: none;
            font-family: 'Outfit', monospace; font-size: 0.8rem; margin-bottom: 1rem;
            transition: 0.3s;
        }
        .input-dark:focus { border-color: var(--accent-primary); }

        .btn {
            width: 100%; padding: 0.9rem; border-radius: 14px; font-weight: 700; font-size: 0.85rem;
            cursor: pointer; border: none; display: flex; align-items: center; justify-content: center;
            gap: 0.6rem; transition: 0.3s; color: white;
        }
        .btn-primary { background: var(--accent-hover); box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(79, 70, 229, 0.3); }
        .btn-secondary { background: #1E293B; border: 1px solid rgba(255,255,255,0.05); }
        .btn-secondary:hover { background: #334155; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #F87171; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

        /* Palette Grid */
        #palette-container {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem;
        }
        .color-block {
            width: 100%; aspect-ratio: 1/1; border-radius: 14px; border: 3px solid transparent;
            cursor: pointer; transition: 0.2s;
        }
        .color-block.active {
            border-color: white; transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.25); z-index: 2;
        }

        /* Canvas Grid */
        .canvas-container {
            background: #111827;
            padding: 12px;
            border-radius: 24px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            max-width: 650px;
            margin: 0 auto;
            position: relative;
        }

        #pixel-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 1.5px;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .pixel-unit {
            background: #1E293B;
            aspect-ratio: 1 / 1;
            border-radius: 2px;
            cursor: crosshair;
        }

        #guide-layer {
            position: absolute; inset: 0; pointer-events: none;
            display: grid; grid-template-columns: repeat(20, 1fr); gap: 1.5px;
            opacity: 0; transition: opacity 0.4s ease; z-index: 10;
        }

        .header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2.5rem; }
        .badge-btn { background: #1E293B; color: #94A3B8; padding: 0.6rem 1.2rem; border-radius: 100px; font-size: 0.65rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .badge-btn:hover { background: var(--accent-hover); color: white; }

        /* Loader */
        #loader-screen {
            position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(12px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 28px; z-index: 500;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(129, 140, 248, 0.1); border-top-color: #818CF8; border-radius: 50%; animation: rot 1s linear infinite; }
        @keyframes rot { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <span class="sheet-title">바이브코딩 시뮬레이션</span>
        </div>
        <div class="nav-links">
            <a href="../../index.html" class="nav-link">홈</a>
            <a href="../03_expert/vibecoding.html" class="nav-link">시뮬레이션</a>
            <a href="gas_hub.html" class="nav-link active">GAS</a>
            <a href="../app_planner.html" class="nav-link">앱 플래너</a>
            <a href="../tutorial_hub.html" class="nav-btn">학습 가이드 <i class="fas fa-graduation-cap"></i></a>
        </div>
    </nav>

    <main class="app-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <!-- GAS SYNC -->
            <div class="glass-card">
                <h3 class="section-title"><i class="fas fa-cloud"></i> GAS Sync</h3>
                <input type="text" id="gas-url-input" placeholder="GAS Web App URL..." class="input-dark">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <button onclick="saveUrl()" class="btn btn-secondary">URL 저장</button>
                    <button onclick="testSync()" class="btn btn-secondary">연결 테스트</button>
                </div>
            </div>

            <!-- PALETTE -->
            <div class="glass-card">
                <h3 class="section-title" style="color: #F472B6;"><i class="fas fa-palette"></i> Palette</h3>
                <div id="palette-container">
                    <!-- JS Generated -->
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05);">
                    <button onclick="setEraserMode()" class="btn btn-secondary"><i class="fas fa-eraser"></i> 지우개</button>
                    <button onclick="clearAll()" class="btn btn-danger"><i class="fas fa-trash"></i> 초기화</button>
                </div>
            </div>

            <div class="glass-card" style="background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), transparent);">
                <h3 class="section-title" style="color: #60A5FA;"><i class="fas fa-database"></i> Cloud CRUD</h3>
                <button onclick="uploadToCloud()" class="btn btn-primary" style="margin-bottom: 0.75rem; height: 60px;">
                    <i class="fas fa-cloud-upload-alt"></i> 현재 그림 저장
                </button>
                <div id="history-list" class="text-slate-400 text-xs text-center py-4 max-h-[200px] overflow-y-auto">
                    저장된 기록이 없습니다.
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="main-content glass-card relative" style="min-height: 600px;">
            <div id="loader-screen">
                <div class="spinner"></div>
                <p style="margin-top: 1.5rem; font-weight: 700; color: #818CF8;">Processing...</p>
            </div>

            <div class="header-flex">
                <div>
                    <h1 style="font-size: 2.2rem; font-weight: 900; letter-spacing: -0.05em; margin-bottom: 0.25rem;">Pixel Master Pro</h1>
                    <p style="color: var(--text-dim); font-size: 0.85rem;">드래그로 그림을 그리고 보관함에 저장하세요.</p>
                </div>
                <button onclick="toggleHeartGuide()" class="badge-btn">GUIDE ON/OFF</button>
            </div>

            <div class="canvas-container">
                <div id="pixel-grid">
                    <!-- JS Generated -->
                </div>
                <div id="guide-layer">
                    <!-- JS Generated -->
                </div>
            </div>
        </div>
    </main>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 right-6 px-6 py-4 rounded-xl text-white font-bold shadow-xl transition-all duration-500 z-[9999] flex items-center gap-3';
            toast.style.transform = 'translateY(100px)';
            toast.style.opacity = '0';
            
            if (type === 'success') {
                toast.style.background = 'linear-gradient(135deg, #10B981, #059669)';
                toast.innerHTML = `<i class="fas fa-check-circle text-xl"></i><span>${message}</span>`;
            } else if (type === 'error') {
                toast.style.background = 'linear-gradient(135deg, #EF4444, #DC2626)';
                toast.innerHTML = `<i class="fas fa-exclamation-circle text-xl"></i><span>${message}</span>`;
            } else {
                toast.style.background = 'linear-gradient(135deg, #6366F1, #4F46E5)';
                toast.innerHTML = `<i class="fas fa-spinner fa-spin text-xl"></i><span>${message}</span>`;
            }
            
            document.body.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.style.transform = 'translateY(0)';
                toast.style.opacity = '1';
            });
            
            setTimeout(() => {
                toast.style.transform = 'translateY(100px)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, type === 'info' ? 1500 : 3000); // info는 더 빨리 사라지게 함
        }

        const SIZE = 20;
        const COLOR_LIST = ['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#4B0082','#9400D3','#FF00FF','#FF6347','#32CD32','#1E90FF','#FFD700','#8B4513','#708090','#FFFFFF','#1E293B'];
        const BG_COLOR = '#1E293B';
        const HEART_INDICES = [48,49,50,51,67,68,69,70,71,72,86,87,88,89,90,91,92,93,105,106,107,108,109,110,111,112,113,114,125,126,127,128,129,130,131,132,133,134,146,147,148,149,150,151,152,153,167,168,169,170,171,172,188,189,190,191,209,210,230];
        
        let currentColor = COLOR_LIST[14];
        let mouseDown = false;
        let drawingState = Array(400).fill(BG_COLOR);

        function startApp() {
            const grid = document.getElementById('pixel-grid');
            const guide = document.getElementById('guide-layer');
            const palette = document.getElementById('palette-container');

            // 1. Grid & Guide Init
            grid.innerHTML = '';
            guide.innerHTML = '';
            for(let i=0; i<400; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel-unit';
                pixel.style.backgroundColor = BG_COLOR;
                pixel.onmousedown = (e) => { e.preventDefault(); mouseDown = true; updatePixel(i, pixel); };
                pixel.onmouseenter = () => { if(mouseDown) updatePixel(i, pixel); };
                grid.appendChild(pixel);

                const gItem = document.createElement('div');
                gItem.style.backgroundColor = HEART_INDICES.includes(i) ? 'rgba(236, 72, 153, 0.4)' : 'transparent';
                guide.appendChild(gItem);
            }
            window.onmouseup = () => mouseDown = false;

            // 2. Palette Init
            palette.innerHTML = '';
            COLOR_LIST.forEach(c => {
                const b = document.createElement('div');
                b.className = `color-block ${c === currentColor ? 'active' : ''}`;
                b.style.backgroundColor = c;
                b.onclick = () => {
                    currentColor = c;
                    document.querySelectorAll('.color-block').forEach(el => el.classList.remove('active'));
                    b.classList.add('active');
                };
                palette.appendChild(b);
            });

            // 3. Load Storage
            const saved = localStorage.getItem('vcep_gas_url');
            if(saved) {
                document.getElementById('gas-url-input').value = saved;
                fetchHistory();
            }
        }

        function updatePixel(i, el) {
            el.style.backgroundColor = currentColor;
            drawingState[i] = currentColor;
        }

        function setEraserMode() {
            currentColor = BG_COLOR;
            document.querySelectorAll('.color-block').forEach(el => el.classList.remove('active'));
        }

        function clearAll() {
            if(!confirm('정말 캔버스를 초기화하시겠습니까?')) return;
            document.querySelectorAll('.pixel-unit').forEach(p => p.style.backgroundColor = BG_COLOR);
            drawingState.fill(BG_COLOR);
        }

        function toggleHeartGuide() {
            const g = document.getElementById('guide-layer');
            g.style.opacity = g.style.opacity === '1' ? '0' : '1';
        }

        function saveUrl() {
            const val = document.getElementById('gas-url-input').value.trim();
            if(!val) return showToast('URL을 입력해주세요.', 'error');
            localStorage.setItem('vcep_gas_url', val);
            showToast('GAS URL이 브라우저에 저장되었습니다.', 'success');
        }

        async function uploadToCloud() {
            const url = localStorage.getItem('vcep_gas_url');
            if(!url) return showToast('GAS URL을 먼저 설정해주세요.', 'error');

            const loader = document.getElementById('loader-screen');
            loader.style.display = 'flex';

            const data = {
                action: 'insert',
                app: 'Pixel Master',
                title: 'New Artwork',
                content: JSON.stringify(drawingState),
                timestamp: new Date().toISOString()
            };

            try {
                console.log("Pixel Master 전송 시도...");
                
                const payloadData = { action: 'save', payload: drawingState };
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payloadData)
                });
                
                const resultText = await response.text();
                const lowerText = resultText.toLowerCase();
                
                if (lowerText.includes("성공") || lowerText.includes("success")) {
                    showToast('클라우드 보관함에 안전하게 저장되었습니다!', 'success');
                    setTimeout(() => fetchHistory(), 1000); 
                } else {
                    showToast('서버 응답 오류: ' + resultText, 'error');
                }

            } catch (e) {
                console.error('Save Error:', e);
                showToast('네트워크 또는 CORS 오류가 발생했습니다.', 'error');
            } finally {
                loader.style.display = 'none';
            }
        }

        async function fetchHistory() {
            const url = localStorage.getItem('vcep_gas_url');
            if(!url) return;

            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '<div class="py-2 opacity-50">Loading...</div>';

            try {
                // 사용자의 GAS는 list 액션을 기대함
                const response = await fetch(url + '?action=list');
                const result = await response.json();
                
                if (result.status === 'success' && result.data.length > 0) {
                    historyList.innerHTML = '';
                    // 최신 10개만 역순으로 표시
                    result.data.slice(-10).reverse().forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'text-left py-2 border-b border-white/5 last:border-0 cursor-pointer hover:bg-white/5 transition px-2 rounded';
                        const timeStr = new Date(item.time).toLocaleString();
                        div.innerHTML = `
                            <div class="font-bold text-blue-400"># 픽셀 아트 (Row ${item.row})</div>
                            <div class="text-[9px] opacity-40">${timeStr}</div>
                        `;
                        div.onclick = () => loadArtworkFromServer(item.row);
                        historyList.appendChild(div);
                    });
                } else {
                    historyList.innerHTML = '<div class="py-2 opacity-50">저장된 기록이 없습니다.</div>';
                }
            } catch (e) {
                historyList.innerHTML = '<div class="py-2 text-red-400/50">Load Error</div>';
            }
        }

        async function loadArtworkFromServer(row) {
            const url = localStorage.getItem('vcep_gas_url');
            if(!url) return;
            
            try {
                showToast('그림을 서버에서 불러오는 중...', 'info');
                const response = await fetch(url + '?action=load&row=' + row);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const data = JSON.parse(result.data); // 저장된 배열 문자열 파싱
                    drawingState = data;
                    const pixels = document.querySelectorAll('.pixel-unit');
                    data.forEach((color, i) => {
                        if(pixels[i]) pixels[i].style.backgroundColor = color;
                    });
                    showToast(`Row ${row}번 그림을 성공적으로 불러왔습니다!`, 'success');
                } else {
                    showToast('그림을 불러올 수 없습니다.', 'error');
                }
            } catch (e) {
                showToast('데이터 형식이 올바르지 않거나 불러오기 실패했습니다.', 'error');
            }
        }

        async function testSync() {
            const url = document.getElementById('gas-url-input').value.trim();
            if(!url) return showToast('URL을 입력해주세요.', 'error');
            
            showToast('GAS 연결 테스트 중...', 'info');
            
            try {
                const separator = url.includes('?') ? '&' : '?';
                const finalUrl = `${url}${separator}action=test`; // GAS의 test 액션 호출

                const response = await fetch(finalUrl);
                const data = await response.json();
                
                if(data.status === 'ok') {
                    showToast('연결 성공! GAS 서버 응답 정상', 'success');
                    // 테스트 성공 시 자동으로 URL 저장 처리 (사용자 실수 방지)
                    localStorage.setItem('vcep_gas_url', url);
                } else {
                    showToast('응답 확인 실패: 데이터 오류', 'error');
                }
            } catch (e) {
                console.error('GAS Test Error:', e);
                showToast('연결 실패! URL 또는 권한 설정을 확인하세요.', 'error');
            }
        }

        window.addEventListener('DOMContentLoaded', startApp);
    </script>
</body>
</html>
