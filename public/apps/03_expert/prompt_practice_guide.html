<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프롬프트 마스터 가이드: 철벽 AI의 마음을 녹여라!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
            --accent-love: #fb7185;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #0f172a;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* ── 배경 레이어 (게임 동일) ── */
        .bg-layer {
            position: fixed; inset: 0;
            background-size: cover; background-position: center;
            transition: none; z-index: -2;
        }

        /* ── 유리 패널 (게임 동일) ── */
        .glass-panel {
            background: rgba(15,23,42,0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* ── 캐릭터 박스 (게임 동일) ── */
        #char-box {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            height: 80vh;
            display: flex; align-items: flex-end;
            transition: all 0.5s ease;
            pointer-events: none;
        }
        #guide-char {
            height: 100%; object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.6));
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
            image-rendering: -webkit-optimize-contrast;
        }

        /* ── 대화 박스 (게임 동일) ── */
        #dialogue-box {
            position: absolute;
            bottom: 120px;
            left: clamp(20px, calc(50% - 620px), 140px);
            width: min(46vw, 760px);
            max-width: calc(100vw - 500px);
            padding: 28px 32px;
            z-index: 100;
            cursor: pointer;
        }
        #dialogue-box.centered {
            left: 50%;
            width: 90%;
            max-width: 900px;
            transform: translateX(-50%);
        }
        .speaker-char  { color: var(--accent-love);    font-weight: 900; margin-right: 6px; }
        .speaker-me    { color: var(--accent-primary);  font-weight: 900; margin-right: 6px; }
        .speaker-narrator { color: #94a3b8; font-style: italic; }
        #dialogue-text { font-size: 1.05rem; line-height: 1.8; min-height: 1.8em; }
        #advance-hint  {
            position: absolute; bottom: 14px; right: 22px;
            font-size: 10px; color: #475569; font-weight: 700;
            animation: blink 1.4s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ── 가이드 패널 (= 게임 action-panel) ── */
        #guide-panel {
            position: fixed; top: 90px; right: 40px;
            width: 400px; max-height: calc(100vh - 130px);
            padding: 28px; overflow-y: auto; z-index: 150;
            transition: width 0.25s ease, transform 0.25s ease, top 0.25s ease, max-height 0.25s ease;
        }
        /* 패널 스크롤바 */
        #guide-panel::-webkit-scrollbar { width: 4px; }
        #guide-panel::-webkit-scrollbar-track { background: transparent; }
        #guide-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

        /* ── 스테이지 뱃지 (게임 동일) ── */
        #stage-badge {
            position: fixed; top: 20px; left: 20px;
            background: rgba(129,140,248,0.15);
            border: 1px solid rgba(129,140,248,0.3);
            border-radius: 99px; padding: 6px 16px;
            font-size: 11px; font-weight: 900;
            letter-spacing: 2px; color: #818cf8; z-index: 300;
        }

        /* ── 진행 점 (게임 동일) ── */
        #stage-progress {
            position: fixed; top: 28px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px; align-items: center; z-index: 300;
        }
        .s-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: all 0.4s;
        }
        .s-dot.active { background: var(--accent-primary); width: 20px; border-radius: 4px; }
        .s-dot.done   { background: #34d399; }
        .s-dot.bonus  { background: #a78bfa; width: 20px; border-radius: 4px; }

        /* ── 상단 우측 버튼 ── */
        #top-right {
            position: fixed; top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 300;
        }
        .top-btn {
            padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 900;
            letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
        }
        .play-btn-sm {
            background: linear-gradient(135deg, var(--accent-love), var(--accent-secondary));
            color: white; box-shadow: 0 6px 15px rgba(251,113,133,0.3);
        }
        .play-btn-sm:hover { transform: translateY(-1px); }

        /* ── 하단 내비게이션 ── */
        #nav-bar {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateX(-200px);
            display: flex; align-items: center; gap: 16px; z-index: 300;
        }
        .nav-btn-ctrl {
            width: 52px; height: 52px; border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: white; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn-ctrl:hover { background: rgba(129,140,248,0.2); border-color: rgba(129,140,248,0.5); }
        #nav-counter {
            font-size: 11px; color: #475569; font-weight: 700; letter-spacing: 1px;
        }

        /* ── 패널 내 읽기전용 필드 (게임 input 스타일) ── */
        .field-display {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 14px 18px;
            font-size: 0.9rem; color: #cbd5e1; line-height: 1.6;
            margin-bottom: 10px;
        }
        .field-label {
            font-size: 9px; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase; margin-bottom: 5px; display: block;
        }

        /* ── 온도 바 ── */
        .temp-bar {
            height: 10px; border-radius: 99px;
            background: linear-gradient(to right,#60a5fa 0%,#818cf8 35%,#a78bfa 60%,#f97316 88%,#ef4444 100%);
            position: relative; margin: 10px 0;
        }
        .temp-cursor {
            position: absolute; top: -4px;
            width: 18px; height: 18px; border-radius: 50%;
            background: white; border: 3px solid #818cf8;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(129,140,248,0.6);
            transition: left 0.3s;
        }

        /* ── CoT 스텝 ── */
        .cot-step {
            padding: 10px 14px; border-radius: 14px; margin-bottom: 8px;
            border-left: 3px solid;
        }

        /* ── 엔딩 카드 ── */
        .ending-card {
            padding: 12px 16px; border-radius: 16px; margin-bottom: 8px;
            border: 1px solid; display: flex; align-items: center; gap: 12px;
        }

        /* ── 인트로 전체화면 ── */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 400;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(15,23,42,0.5);
        }
        .intro-card {
            width: min(920px, 92vw);
            padding: 48px 44px;
            text-align: center;
        }
        .intro-kicker {
            font-size: 10px;
            letter-spacing: 3px;
            color: #818cf8;
            font-weight: 900;
            text-transform: uppercase;
        }
        .intro-title {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 900;
            line-height: 1.15;
            margin-top: 10px;
        }
        .intro-sub {
            margin-top: 16px;
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.8;
        }
        .intro-actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e2e8f0;
            font-weight: 800;
            padding: 14px 24px;
            border-radius: 14px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-decoration: none;
        }

        /* ── 페이드 트랜지션 ── */
        .fade-out { animation: fadeOut 0.3s forwards; }
        .fade-in  { animation: fadeIn  0.3s forwards; }
        @keyframes fadeOut { to { opacity: 0; } }
        @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }

        /* ── 앰비언트 라이트 ── */
        .ambient-light {
            position: fixed; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(129,140,248,0.12) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        /* ── 버튼 primary ── */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white; font-weight: 900; padding: 16px 32px;
            border-radius: 16px; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 10px 20px -10px rgba(129,140,248,0.5);
            transition: all 0.3s; display: inline-block; cursor: pointer;
        }
        .btn-primary:hover { transform: translateY(-2px); }

        /* ── RCTF 포커스 모드 (stage 1) ── */
        body.rctf-focus #guide-panel {
            width: 500px;
            top: 76px;
            max-height: calc(100vh - 100px);
            transform: scale(1.03);
            transform-origin: top right;
        }
        .rctf-detail {
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.03);
        }
        .rctf-detail .k {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .rctf-detail .d {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        /* ── 중앙 포커스 카드 (동적 설명용) ── */
        #center-focus-card {
            position: absolute;
            top: 38%;
            left: 32%;
            transform: translate(-50%, -50%) scale(0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 250;
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            width: min(340px, 80vw);
        }
        #center-focus-card.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .cf-letter {
            font-size: 5rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            line-height: 1;
            margin-bottom: 12px;
        }
        .cf-title {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 16px;
            color: white;
            letter-spacing: 1px;
        }
        .cf-desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            word-break: keep-all;
        }

        /* ── 모바일 겹침 방지 ── */
        @media (max-width: 900px) {
            #center-focus-card {
                left: 50%;
                top: 40%;
            }
            #dialogue-box {
                left: 50%;
                width: calc(100% - 24px);
                max-width: none;
                bottom: 100px;
                padding: 20px 18px;
                transform: translateX(-50%);
            }
            #dialogue-box.centered {
                width: calc(100% - 24px);
            }
            #nav-bar {
                bottom: 20px;
                transform: translateX(-50%);
            }
            .nav-btn-ctrl {
                width: 44px;
                height: 44px;
                border-radius: 14px;
            }
        }

        @media (max-width: 1400px) and (min-width: 901px) {
            #dialogue-box {
                left: 24px;
                width: min(48vw, 640px);
                max-width: calc(100vw - 460px);
                bottom: 100px;
            }
        }
        @media (max-width: 1280px) {
            body.rctf-focus #guide-panel {
                width: 440px;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <!-- 배경 레이어 -->
    <div id="bg-a" class="bg-layer"></div>
    <div id="bg-b" class="bg-layer" style="z-index:-1; opacity:0; transition: opacity 1s ease;"></div>
    <div class="ambient-light" style="top:-100px; left:-100px;"></div>
    <div class="ambient-light" style="bottom:-100px; right:-100px; background: radial-gradient(circle, rgba(192,132,252,0.1) 0%, transparent 70%);"></div>

    <!-- 상단 UI -->
    <div id="stage-badge">GUIDE</div>
    <div id="stage-progress">
        <div class="s-dot" id="dot-1"></div>
        <div class="s-dot" id="dot-2"></div>
        <div class="s-dot" id="dot-3"></div>
        <div class="s-dot" id="dot-4"></div>
        <div class="s-dot" id="dot-5"></div>
    </div>
    <div id="top-right">
        <a href="prompt_practice.html" class="top-btn play-btn-sm" style="text-decoration:none;">▶ PLAY NOW</a>
    </div>

    <!-- 캐릭터 -->
    <div id="char-box">
        <img id="guide-char" src="./assets/iris_smile_1777880569830.png" alt="">
    </div>

    <!-- 대화 박스 -->
    <div id="dialogue-box" class="glass-panel" onclick="advanceDialogue()">
        <div id="speaker-name" style="font-size:1.1rem; font-weight:900; margin-bottom:10px;"></div>
        <div id="dialogue-text"></div>
        <div id="advance-hint">▼ 클릭 또는 SPACE</div>
    </div>

    <!-- 중앙 포커스 카드 -->
    <div id="center-focus-card">
        <div id="cf-letter" class="cf-letter">R</div>
        <div id="cf-title" class="cf-title">Role (역할)</div>
        <div id="cf-desc" class="cf-desc">AI의 인격과 관점을 고정합니다.</div>
    </div>

    <!-- 가이드 패널 (우측) -->
    <div id="guide-panel" class="glass-panel">
        <div id="panel-content"></div>
    </div>

    <!-- 하단 내비게이션 -->
    <div id="nav-bar">
        <button id="btn-prev" class="nav-btn-ctrl" onclick="goPrev()"><i class="fas fa-chevron-left"></i></button>
        <span id="nav-counter">1 / 8</span>
        <button id="btn-next" class="nav-btn-ctrl" onclick="goNext()"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- 인트로 타이틀 페이지 -->
    <div id="intro-overlay">
        <div class="intro-card glass-panel">
            <div class="intro-kicker">Prompt Practice Guide</div>
            <h1 class="intro-title">프롬프트 마스터 가이드</h1>
            <p class="intro-sub">
                RCTF · Few-shot · Temperature · Negative Prompt · Chain of Thought<br>
                5가지 핵심 기법을 슬라이드로 빠르게 익히고 시뮬레이션으로 넘어가세요.
            </p>
            <div class="intro-actions">
                <button class="btn-primary" onclick="startGuide()">가이드 시작</button>
                <a href="prompt_practice.html" class="btn-secondary">바로 플레이</a>
            </div>
        </div>
    </div>

    <script>
        // ── 슬라이드 데이터 ─────────────────────────────────────────
        const SLIDES = [
            // 0: 인트로 / 개요
            {
                badge: "PROMPT MASTERY · GUIDE",
                bg: './assets/bg_library_sunset_1777880660629.png',
                bgTint: 'rgba(15,23,42,0.50)',
                char: './assets/iris_smile_1777880569830.png',
                dots: [],
                dialogues: [
                    "(도서관 구석, 안내 모드의 아이리스가 책을 읽다 고개를 든다...)",
                    "아이리스: ...가이드를 찾아왔구나. 좋아.",
                    "아이리스: 프롬프트 엔지니어링의 5가지 기술을 순서대로 알려줄게. RCTF부터 Chain of Thought까지.",
                    "아이리스: 각 기술을 제대로 이해해야 실제 시뮬레이션에서 나의 마음을 녹일 수 있어. 준비됐어?",
                ],
                panel: `
                    <div class="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 inline-block"></span>학습 로드맵
                    </div>
                    <div class="space-y-2.5">
                        <div class="flex items-center gap-3 p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl">
                            <span class="w-7 h-7 rounded-full bg-indigo-500/20 flex items-center justify-center text-xs font-black text-indigo-400 shrink-0">1</span>
                            <div><div class="text-xs font-black text-white">RCTF</div><div class="text-[10px] text-slate-500">Role · Context · Task · Format — 모든 기법의 기반</div></div>
                        </div>
                        <div class="flex items-center gap-3 p-3 bg-purple-500/10 border border-purple-500/20 rounded-2xl">
                            <span class="w-7 h-7 rounded-full bg-purple-500/20 flex items-center justify-center text-xs font-black text-purple-400 shrink-0">2</span>
                            <div><div class="text-xs font-black text-white">Few-shot</div><div class="text-[10px] text-slate-500">예시 학습 · 패턴 인식 · Zero→One→Few</div></div>
                        </div>
                        <div class="flex items-center gap-3 p-3 bg-amber-500/10 border border-amber-500/20 rounded-2xl">
                            <span class="w-7 h-7 rounded-full bg-amber-500/20 flex items-center justify-center text-xs font-black text-amber-400 shrink-0">3</span>
                            <div><div class="text-xs font-black text-white">Temperature</div><div class="text-[10px] text-slate-500">창의성 온도 · 0.0~1.0 · 황금 구간 0.6~0.8</div></div>
                        </div>
                        <div class="flex items-center gap-3 p-3 bg-rose-500/10 border border-rose-500/20 rounded-2xl">
                            <span class="w-7 h-7 rounded-full bg-rose-500/20 flex items-center justify-center text-xs font-black text-rose-400 shrink-0">4</span>
                            <div><div class="text-xs font-black text-white">Negative Prompt</div><div class="text-[10px] text-slate-500">금기어 · 제약 조건 · 진심 필터링</div></div>
                        </div>
                        <div class="flex items-center gap-3 p-3 bg-violet-500/10 border border-violet-500/20 rounded-2xl">
                            <span class="w-7 h-7 rounded-full bg-violet-500/20 flex items-center justify-center text-xs font-black text-violet-400 shrink-0">✨</span>
                            <div><div class="text-xs font-black text-violet-300">Chain of Thought (Bonus)</div><div class="text-[10px] text-slate-500">단계별 논리 · 5기법 총정리 · 호감도 55%+ 해금</div></div>
                        </div>
                    </div>
                    <div class="mt-5 pt-4 border-t border-white/10 text-[10px] text-slate-500 text-center">SPACE · 클릭 · →키로 대화 진행 &nbsp;|&nbsp; ←키로 이전</div>
                `
            },

            // 1: RCTF
            {
                badge: "STAGE 1: RCTF",
                bg: './assets/bg_library_sunset_1777880660629.png',
                bgTint: 'rgba(15,23,42,0.42)',
                char: './assets/iris_smile_1777880569830.png',
                dots: ['active'],
                dialogues: [
                    "아이리스: 첫 번째. RCTF — 이건 모든 프롬프트의 뼈대야.",
                    "아이리스: 먼저, Role(역할). AI의 인격이나 관점을 고정하는 거야.",
                    "아이리스: 다음은 Context(상황). 언제, 어디서, 어떤 분위기인지 상황을 구체적으로 알려줘.",

        // ── 상태 ─────────────────────────────────────────────
        let slideIdx = 0;
        let diaIdx   = 0;
        let isTyping = false;
        let typingTimer = null;
        let activeBg = 'a';
        let introVisible = true;

        // ── 초기화 ───────────────────────────────────────────
        function init() {
            preloadImages();
            renderSlide(0, true);
        }

        function startGuide() {
            if (!introVisible) return;
            const intro = document.getElementById('intro-overlay');
            intro.classList.add('fade-out');
            setTimeout(() => {
                intro.style.display = 'none';
                introVisible = false;
            }, 300);
        }

        function preloadImages() {
            SLIDES.forEach(s => {
                const img = new Image();
                img.src = s.bg;
            });
        }

        // ── 슬라이드 렌더링 ──────────────────────────────────
        function renderSlide(idx, firstLoad) {
            const s = SLIDES[idx];

            // 배경
            switchBackground(s.bg, s.bgTint, firstLoad);

            // 캐릭터
            const charEl = document.getElementById('guide-char');
            charEl.style.opacity = '0';
            setTimeout(() => {
                charEl.src = s.char;
                charEl.style.opacity = '1';
            }, firstLoad ? 100 : 400);

            // 뱃지
            document.getElementById('stage-badge').textContent = s.badge;

            // 진행 점
            const ids = ['dot-1','dot-2','dot-3','dot-4','dot-5'];
            ids.forEach((id, i) => {
                const el = document.getElementById(id);
                el.className = 's-dot';
                const state = s.dots[i];
                if (state) el.classList.add(state);
            });

            // 패널 내용
            document.getElementById('panel-content').innerHTML = s.panel;
            document.body.classList.toggle('rctf-focus', idx === 1);

            // 마지막 슬라이드엔 패널에서 직접 플레이 가능
            const panel = document.getElementById('guide-panel');
            if (idx === SLIDES.length - 1) {
                document.getElementById('dialogue-box').classList.add('centered');
            } else {
                document.getElementById('dialogue-box').classList.remove('centered');
            }

            // 네비 카운터
            document.getElementById('nav-counter').textContent = `${idx + 1} / ${SLIDES.length}`;

            // 대화 초기화
            diaIdx = 0;
            showDialogue(s.dialogues[0]);
            updateNavButtons();
        }

        // ── 배경 전환 ────────────────────────────────────────
        function switchBackground(url, tint, instant) {
            const next = activeBg === 'a' ? 'b' : 'a';
            const layerNext = document.getElementById(`bg-${next}`);
            const layerCurr = document.getElementById(`bg-${activeBg}`);
            layerNext.style.backgroundImage = `linear-gradient(${tint}, ${tint}), url('${url}')`;
            layerNext.style.backgroundSize = 'cover';
            layerNext.style.backgroundPosition = 'center';
            if (instant) {
                layerNext.style.transition = 'none';
                layerNext.style.opacity = '1';
                layerCurr.style.opacity = '0';
            } else {
                layerNext.style.transition = 'opacity 1s ease';
                layerNext.style.opacity = '1';
                layerCurr.style.transition = 'opacity 1s ease';
                layerCurr.style.opacity = '0';
            }
            activeBg = next;
        }

        // ── 대화 출력 ────────────────────────────────────────
        function showDialogue(text) {
            clearTimeout(typingTimer);
            isTyping = true;

            const nameEl = document.getElementById('speaker-name');
            const textEl = document.getElementById('dialogue-text');

            let displayName = '';
            let content = text;

            if (text.startsWith('(')) {
                nameEl.style.display = 'none';
                nameEl.textContent = '';
                textEl.className = 'speaker-narrator';
            } else if (text.includes(': ')) {
                const sep = text.indexOf(': ');
                displayName = text.substring(0, sep);
                content = text.substring(sep + 2);
                nameEl.style.display = 'block';
                nameEl.textContent = displayName;
                if (displayName === '아이리스' || displayName === '카일') {
                    nameEl.className = 'speaker-char';
                } else {
                    nameEl.className = 'speaker-me';
                }
                textEl.className = '';
            } else {
                nameEl.style.display = 'none';
                textEl.className = '';
            }

            // 타이핑 효과
            let i = 0;
            textEl.textContent = '';
            (function type() {
                if (i < content.length) {
                    textEl.textContent += content[i++];
                    typingTimer = setTimeout(type, 22);
                } else {
                    isTyping = false;
                }
            })();

            // 특수 중앙 팝업 연동
            updateCenterFocusCard(slideIdx, diaIdx);
        }

        // ── 중앙 포커스 카드 제어 ─────────────────────────────
        function updateCenterFocusCard(sIdx, dIdx) {
            const card = document.getElementById('center-focus-card');
            if (!card) return;
            
            if (sIdx === 1) { // RCTF 슬라이드
                if (dIdx === 1) {
                    showCenterCard('R', 'Role (역할)', 'AI의 인격이나 관점을 고정합니다.<br><br><span style="color:#818cf8; font-weight:bold;">예: "다정하고 솔직한 소꿉친구"</span>', '#818cf8');
                } else if (dIdx === 2) {
                    showCenterCard('C', 'Context (상황)', '언제, 어디서, 어떤 분위기인지 상황을 구체적으로 알려줍니다.<br><br><span style="color:#c084fc; font-weight:bold;">예: "방과 후 노을 지는 교실"</span>', '#c084fc');
                } else if (dIdx === 3) {
                    showCenterCard('T', 'Task (임무)', 'AI가 실제로 해야 할 행동을 명확히 지시합니다.<br><br><span style="color:#34d399; font-weight:bold;">예: "설레는 첫마디를 건네줘"</span>', '#34d399');
                } else if (dIdx === 4) {
                    showCenterCard('F', 'Format (형식)', '출력 형태나 조건을 명확하게 제한합니다.<br><br><span style="color:#fb7185; font-weight:bold;">예: "반말로 2~3문장 짧게"</span>', '#fb7185');
                } else {
                    card.classList.remove('active');
                }
            } else {
                card.classList.remove('active');
            }
        }

        function showCenterCard(letter, title, desc, color) {
            const card = document.getElementById('center-focus-card');
            const lEl = document.getElementById('cf-letter');
            const tEl = document.getElementById('cf-title');
            const dEl = document.getElementById('cf-desc');
            
            lEl.textContent = letter;
            lEl.style.color = color;
            lEl.style.textShadow = `0 0 30px ${color}80`;
            tEl.textContent = title;
            dEl.innerHTML = desc;
            
            // 애니메이션 재시작
            card.classList.remove('active');
            void card.offsetWidth; 
            card.classList.add('active');
            card.style.borderColor = color;
            card.style.boxShadow = `0 20px 40px rgba(0,0,0,0.5), 0 0 50px ${color}30`;
        }

        function skipTyping() {
            clearTimeout(typingTimer);
            isTyping = false;
            const s = SLIDES[slideIdx];
            const text = s.dialogues[diaIdx];
            let content = text;
            if (!text.startsWith('(') && text.includes(': ')) {
                content = text.substring(text.indexOf(': ') + 2);
            }
            document.getElementById('dialogue-text').textContent = content;
        }

        // ── 대화 진행 ────────────────────────────────────────
        function advanceDialogue() {
            if (isTyping) { skipTyping(); return; }
            const s = SLIDES[slideIdx];
            diaIdx++;
            if (diaIdx < s.dialogues.length) {
                showDialogue(s.dialogues[diaIdx]);
            } else if (diaIdx === s.dialogues.length) {
                if (slideIdx < SLIDES.length - 1) {
                    showDialogue("(대화가 모두 끝났습니다. 하단의 다음 슬라이드 버튼을 클릭하세요.)");
                }
                document.getElementById('advance-hint').textContent = '▶ 다음 슬라이드 이동 가능';
            }
            updateNavButtons();
        }

        // ── 하단 버튼 상태 업데이트 ────────────────────────────
        function updateNavButtons() {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const s = SLIDES[slideIdx];
            
            if (btnPrev) {
                if (slideIdx === 0) {
                    btnPrev.style.opacity = '0.3';
                    btnPrev.style.pointerEvents = 'none';
                } else {
                    btnPrev.style.opacity = '1';
                    btnPrev.style.pointerEvents = 'auto';
                }
            }
            
            if (btnNext) {
                if (slideIdx === SLIDES.length - 1) {
                    btnNext.style.opacity = '0.3';
                    btnNext.style.pointerEvents = 'none';
                } else if (diaIdx < s.dialogues.length) {
                    btnNext.style.opacity = '0.3';
                    btnNext.style.pointerEvents = 'none';
                } else {
                    btnNext.style.opacity = '1';
                    btnNext.style.pointerEvents = 'auto';
                }
            }
        }

        // ── 슬라이드 이동 ────────────────────────────────────
        function goNext() {
            const s = SLIDES[slideIdx];
            if (diaIdx < s.dialogues.length) return; // 대화 진행 중일 때는 넘어갈 수 없음

            if (slideIdx < SLIDES.length - 1) {
                slideIdx++;
                renderSlide(slideIdx, false);
                document.getElementById('advance-hint').textContent = '▼ 클릭 또는 SPACE';
            }
        }

        function goPrev() {
            if (slideIdx > 0) {
                slideIdx--;
                renderSlide(slideIdx, false);
                document.getElementById('advance-hint').textContent = '▼ 클릭 또는 SPACE';
            }
        }

        // ── 키보드 ───────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (introVisible) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    startGuide();
                }
                return;
            }
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (isTyping) { skipTyping(); return; }
                const s = SLIDES[slideIdx];
                if (diaIdx < s.dialogues.length) {
                    advanceDialogue();
                } else {
                    if (slideIdx < SLIDES.length - 1) {
                        goNext();
                    }
                }
            }
            if (e.key === 'ArrowLeft') goPrev();
        });

        // ── 실행 ─────────────────────────────────────────────
        init();
    </script>
</body>
</html>
