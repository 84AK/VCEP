<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시한폭탄 토크 - VCEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --danger-intense: #b91c1c;
            --success: #10b981;
            --text-main: #f8fafc;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at 50% 50%, #1e293b, var(--bg-color)); 
            color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; overflow: hidden; 
            transition: background 0.5s ease;
        }
        
        /* 긴장감 고조 배경 효과 */
        body.tension-1 { background: radial-gradient(circle at 50% 50%, #331b22, #0f172a); }
        body.tension-2 { background: radial-gradient(circle at 50% 50%, #4a1520, #0f172a); animation: bgPulse 2s infinite alternate; }
        body.tension-3 { background: radial-gradient(circle at 50% 50%, #7f1d1d, #2e0911); animation: bgPulse 0.5s infinite alternate; }

        @keyframes bgPulse {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        .container { 
            text-align: center; max-width: 450px; width: 90%;
            padding: 40px 30px; z-index: 2; position: relative; 
            background: var(--glass-bg);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.3s;
        }

        /* 긴장감 고조 컨테이너 효과 */
        body.tension-3 .container {
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.4), inset 0 0 30px rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }

        .bomb { 
            font-size: 100px; margin: 30px 0; 
            animation: pulse 1s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); 
            transition: transform 0.1s; user-select: none; 
            filter: drop-shadow(0 10px 15px rgba(239, 68, 68, 0.3));
            display: inline-block;
        }

        /* 폭탄 흔들림 효과 */
        @keyframes bombShake {
            0%, 100% { transform: scale(1.1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(5deg); }
        }
        @keyframes bombShakeIntense {
            0%, 100% { transform: scale(1.3) translate(0, 0); }
            20% { transform: scale(1.3) translate(-3px, 3px); }
            40% { transform: scale(1.3) translate(3px, -3px); }
            60% { transform: scale(1.3) translate(-3px, -3px); }
            80% { transform: scale(1.3) translate(3px, 3px); }
        }

        .topic-box { 
            background: rgba(255,255,255,0.05); 
            border-radius: 16px; padding: 25px; margin-bottom: 30px; 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
            position: relative;
        }

        .timer { 
            font-family: 'Outfit', sans-serif; font-size: 4.5rem; font-weight: 900; 
            color: var(--danger); margin: 0; 
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.6); 
            font-variant-numeric: tabular-nums;
            transition: all 0.3s;
        }

        body.tension-3 .timer {
            color: #fca5a5;
            text-shadow: 0 0 40px #ef4444, 0 0 20px #ef4444;
            transform: scale(1.1);
        }

        .btn { 
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: white; border: none; padding: 16px 36px; 
            font-size: 1.2rem; border-radius: 50px; cursor: pointer; 
            font-weight: 700; font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5), inset 0 2px 0 rgba(255,255,255,0.2); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .btn:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.6), inset 0 2px 0 rgba(255,255,255,0.2); 
        }
        .btn:active {
            transform: translateY(1px);
        }

        /* 예외 터치 허용 버튼 (주제 변경) */
        .btn-change-topic {
            background: rgba(255,255,255,0.1);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            display: none; /* 시작 전엔 숨김 */
        }
        .btn-change-topic:hover {
            background: rgba(255,255,255,0.2);
            color: white;
            transform: translateY(-2px);
        }

        @keyframes pulse { 
            from { transform: scale(1); } 
            to { transform: scale(1.08); filter: drop-shadow(0 15px 25px rgba(239, 68, 68, 0.6)); } 
        }

        .explosion { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: radial-gradient(circle, #ef4444, #7f1d1d); 
            z-index: 10; opacity: 0; pointer-events: none; 
            transition: opacity 0.3s ease-in-out; display:flex; 
            justify-content:center; align-items:center; flex-direction:column; color: white; 
        }
        .exploded .explosion { 
            opacity: 1; pointer-events: all; animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; 
        }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 10px, 0); }
            40%, 60% { transform: translate3d(10px, -10px, 0); }
        }
    </style>
</head>
<body>
    <div class="explosion" id="explosionScreen">
        <div style="font-size: 7rem; filter: drop-shadow(0 0 20px rgba(255,255,255,0.5));">💥</div>
        <div style="font-size: 2.2rem; margin-top:20px; font-weight:800; font-family:'Outfit', sans-serif;">터치 감지됨!</div>
        <p style="font-size:1.1rem; opacity:0.9; margin-top:10px;">대화에 집중하지 않아 폭탄이 터졌습니다.</p>
        <button class="btn" style="background: white; color: #ef4444; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-top:40px;" onclick="location.reload()">다시 도전하기</button>
    </div>
    
    <div class="container" id="mainUI">
        <h1 style="font-family:'Outfit'; font-size: 2.2rem; margin-top:0;">💣 시한폭탄 토크</h1>
        <p style="color:#94a3b8; margin-bottom:30px; font-size:0.95rem;">타이머가 끝날 때까지 <b>아무도 화면을 터치할 수 없습니다.</b></p>
        
        <div class="topic-box">
            <h3 style="margin-top:0; color:#fbbf24; font-size:1.1rem; text-transform:uppercase; letter-spacing:1px;">오늘의 대화 주제</h3>
            <p id="topicText" style="font-size:1.2rem; line-height:1.6; margin-bottom:0; font-weight:600;">버튼을 눌러 주제를 뽑으세요.</p>
            <button id="changeTopicBtn" class="btn-change-topic" onclick="changeTopic()">다른 주제로 넘어가기 🔄</button>
        </div>

        <div class="bomb" id="bomb">💣</div>
        <div class="timer" id="timer">03:00</div>
        
        <button class="btn" id="startBtn" style="margin-top:35px; width:100%;" onclick="startGame()">폭탄 타이머 시작</button>
    </div>

    <script>
        // --- VCEP 통합 싱크 시스템 (Iframe 전용) ---
        (function() {
            const originalSetItem = localStorage.setItem;
            localStorage.setItem = function(key, value) {
                originalSetItem.apply(this, arguments);
                if(key.startsWith('vcep_')) {
                    try {
                        window.parent.postMessage({
                            type: 'vcep_save',
                            category: key.replace('vcep_', ''),
                            data: JSON.parse(value)
                        }, '*');
                    } catch(e) { console.warn("Parent sync failed", e); }
                }
            };
        })();

        const topics = [
            "내 인생에서 가장 지우고 싶은 이불킥 흑역사는?",
            "100억이 생기면 가장 먼저 하고 싶은 일 3가지",
            "지금 이 순간 가장 떠오르는 사람은?",
            "만약 내일 세상이 멸망한다면 오늘 밤 먹고 싶은 음식은?",
            "나의 가장 큰 콤플렉스와 그것을 사랑하는 방법은?",
            "스마트폰 없이 1세기를 살기 vs 평생 친구 없이 살기",
            "내가 살면서 했던 가장 귀여운 거짓말은?",
            "초능력을 하나 가질 수 있다면 무엇을 원하나요?",
            "나를 가장 화나게 하는 사람의 특징은?",
            "과거로 돌아간다면 언제로 돌아가고 싶나요?"
        ];
        
        let timeLeft = 180;
        let timerId = null;
        let isRunning = false;
        let isExploded = false;

        const localUserId = localStorage.getItem('vcep_userId') || "익명유저";

        // 새로운 주제 뽑기 (중복 방지)
        function changeTopic() {
            if (isExploded) return;
            const current = document.getElementById('topicText').innerText;
            let nextTopic = current;
            while(nextTopic === current) {
                nextTopic = topics[Math.floor(Math.random() * topics.length)];
            }
            document.getElementById('topicText').innerText = nextTopic;
        }

        // 폰 흔들기 감지 변수
        let lastX, lastY, lastZ;
        const SHAKE_THRESHOLD = 15;

        function startGame() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('changeTopicBtn').style.display = 'inline-block'; // 시작 시 표시
            changeTopic(); // 첫 주제 설정
            isRunning = true;
            
            timerId = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                
                // 애니메이션 및 긴장감 고조 로직
                const bomb = document.getElementById('bomb');
                if (timeLeft <= 60 && timeLeft > 30) {
                    document.body.className = 'tension-1';
                    bomb.style.animationDuration = '0.5s';
                } else if (timeLeft <= 30 && timeLeft > 10) {
                    document.body.className = 'tension-2';
                    bomb.style.animation = 'bombShake 0.4s infinite cubic-bezier(0.36, 0.07, 0.19, 0.97)';
                } else if (timeLeft <= 10 && timeLeft > 0) {
                    document.body.className = 'tension-3';
                    bomb.style.animation = 'bombShakeIntense 0.2s infinite';
                    if(navigator.vibrate) navigator.vibrate(50); // 10초 미만 심장박동 진동
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    success();
                }
            }, 1000);

            // 1초 뒤부터 터치 및 클릭 감지 시작 (버튼 누른 직후 오작동 방지)
            setTimeout(() => {
                window.addEventListener('touchstart', explode, {passive: false});
                window.addEventListener('mousedown', explode);
                
                // 디바이스 흔들기 이벤트 리스너 등록
                if (window.DeviceMotionEvent) {
                    window.addEventListener('devicemotion', handleMotion);
                }
            }, 1000);
        }

        // 폰 흔들림 감지 로직
        function handleMotion(e) {
            if (!isRunning || isExploded) return;
            let current = e.accelerationIncludingGravity;
            if(!current.x || !current.y || !current.z) return;

            if (lastX !== undefined) {
                let deltaX = Math.abs(lastX - current.x);
                let deltaY = Math.abs(lastY - current.y);
                let deltaZ = Math.abs(lastZ - current.z);

                if (deltaX + deltaY + deltaZ > SHAKE_THRESHOLD) {
                    changeTopic(); // 폰 흔들면 주제 변경!
                    if(navigator.vibrate) navigator.vibrate(100);
                }
            }
            lastX = current.x;
            lastY = current.y;
            lastZ = current.z;
        }

        function explode(e) {
            if (!isRunning || isExploded) return;
            
            // "주제 변경" 버튼을 눌렀을 때는 폭탄이 터지지 않도록 예외 처리!
            if (e.target.closest('#changeTopicBtn')) {
                return; 
            }

            isExploded = true;
            isRunning = false;
            clearInterval(timerId);
            document.body.className = ''; // 긴장감 효과 해제
            document.body.classList.add('exploded');
            if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); 
            saveData('fail');
        }

        function success() {
            isRunning = false;
            window.removeEventListener('touchstart', explode);
            window.removeEventListener('mousedown', explode);
            if (window.DeviceMotionEvent) window.removeEventListener('devicemotion', handleMotion);
            
            document.body.className = ''; // 긴장감 효과 해제
            document.getElementById('changeTopicBtn').style.display = 'none';
            document.getElementById('bomb').innerText = '🎉';
            document.getElementById('bomb').style.animation = 'none';
            document.getElementById('bomb').style.transform = 'scale(1.2)';
            document.getElementById('bomb').style.filter = 'drop-shadow(0 10px 20px rgba(16, 185, 129, 0.4))';
            document.getElementById('timer').style.color = 'var(--success)';
            document.getElementById('timer').style.textShadow = '0 0 30px rgba(16,185,129,0.6)';
            document.getElementById('timer').innerText = '성공!';
            
            saveData('success');
            setTimeout(() => alert("대단해요! 3분 동안 폰을 만지지 않고 오프라인 대화에 성공했습니다."), 500);
        }

        async function saveData(status) {
            const data = { status: status, topic: document.getElementById('topicText').innerText };
            // 로컬 스토리지 백업
            let localData = JSON.parse(localStorage.getItem('vcep_offline_topic')) || [];
            localData.push({ date: new Date().toISOString(), payload: data });
            localStorage.setItem('vcep_offline_topic', JSON.stringify(localData));
        }
    </script>
</body>
</html>
